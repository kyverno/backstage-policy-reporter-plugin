app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  packages: all

  # Uncomment to enable the Validating Admission Policies sub-page (new frontend system only).
  # Requires the Policy Reporter VAP plugin, see DEVELOPMENT.md.
  extensions:
    - sub-page:policy-reporter/validating-admission-policies: true

organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../catalog/entities.yaml
