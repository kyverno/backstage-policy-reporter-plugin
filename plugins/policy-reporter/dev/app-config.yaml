# Config for the offline plugin dev app, loaded instead of the repo root
# app-config.yaml (see the `start` script in package.json).
#
# It is deliberately self-contained: the root config points at a real backend on
# :7007 and turns on feature discovery, neither of which the dev app wants.
app:
  title: Policy Reporter dev app
  baseUrl: http://localhost:3000

  # The dev app installs its features explicitly in dev/index.tsx. Discovery is
  # off so a discovered copy of the plugin cannot shadow the fake APIs.
  packages:
    include: []

  extensions:
    # The plugin ships these sub-pages disabled because they need the separately
    # deployed Policy Reporter VAP and Trivy plugins. The fake API serves both,
    # so they are on here and the tabs can be reviewed like any other.
    - sub-page:policy-reporter/validating-admission-policies: true
    - sub-page:policy-reporter/trivy-vulnerabilities: true

backend:
  # Nothing should ever reach this. The fake fetch answers before a request
  # leaves the browser, so a port that is not listening makes any real request
  # fail loudly instead of quietly succeeding against a dev backend on :7007.
  baseUrl: http://localhost:9999
